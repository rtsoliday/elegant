name: CUDA GPU CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/gpu-cuda-ci.yml"
      - "Makefile"
      - "Makefile.build"
      - "README.md"
      - "doc/CUDA_GPU_SUPPORT.md"
      - "src/**"
      - "test/gpu_cuda/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/gpu-cuda-ci.yml"
      - "Makefile"
      - "Makefile.build"
      - "README.md"
      - "doc/CUDA_GPU_SUPPORT.md"
      - "src/**"
      - "test/gpu_cuda/**"
  workflow_dispatch:
    inputs:
      case:
        description: "CUDA benchmark case for smoke and timing stages"
        required: true
        default: "matrix"
        type: string
      cuda_arch:
        description: "CUDA architecture for nvcc, e.g. sm_86"
        required: true
        default: "sm_86"
        type: string
      target_seconds:
        description: "CPU timing target for bounded timing jobs"
        required: true
        default: "60"
        type: string
      run_cuda_compile:
        description: "Run CUDA compile-only and GPU_VERIFY compile stages"
        required: true
        default: true
        type: boolean
      run_gpu_runtime:
        description: "Run GPU runtime correctness stages on a self-hosted CUDA runner"
        required: true
        default: false
        type: boolean
      run_pelegant:
        description: "Include fixed-rank Pelegant smoke in the GPU runtime job"
        required: true
        default: true
        type: boolean
      run_timing:
        description: "Include bounded timing in the GPU runtime job"
        required: true
        default: false
        type: boolean

env:
  JOBS: "4"

jobs:
  cpu-build:
    name: CPU Build And Fallback Report
    runs-on: ubuntu-latest
    env:
      LABEL: cpu-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_ROOT: ${{ github.workspace }}/elegant/test/gpu_cuda/output
    steps:
      - name: Checkout elegant
        uses: actions/checkout@v4
        with:
          path: elegant

      - name: Checkout SDDS
        uses: actions/checkout@v4
        with:
          repository: rtsoliday/SDDS
          path: SDDS

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran openmpi-bin libopenmpi-dev python3

      - name: Build CPU tree
        working-directory: elegant
        run: make CUDA_AUTO=0 -j "$JOBS"

      - name: Run CPU CI stage
        working-directory: elegant
        run: |
          ./test/gpu_cuda/ci_release.sh \
            --cpu-build \
            --fallback-report \
            --label-prefix "$LABEL" \
            --output-root "$OUTPUT_ROOT" \
            --artifact-dir "$OUTPUT_ROOT/ci_artifacts/$LABEL"

      - name: Upload CPU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elegant-cuda-ci-${{ env.LABEL }}
          path: elegant/test/gpu_cuda/output/ci_artifacts/${{ env.LABEL }}/
          if-no-files-found: warn

  cuda-compile:
    name: CUDA Compile And GPU_VERIFY Build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cuda_compile }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    env:
      LABEL: cuda-compile-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_ROOT: ${{ github.workspace }}/elegant/test/gpu_cuda/output
    steps:
      - name: Install checkout and build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates gfortran git make python3

      - name: Checkout elegant
        uses: actions/checkout@v4
        with:
          path: elegant

      - name: Checkout SDDS
        uses: actions/checkout@v4
        with:
          repository: rtsoliday/SDDS
          path: SDDS

      - name: Build CPU dependencies
        working-directory: elegant
        run: make CUDA_AUTO=0 -j "$JOBS"

      - name: Run CUDA compile CI stage
        working-directory: elegant
        run: |
          ./test/gpu_cuda/ci_release.sh \
            --cuda-compile \
            --nvcc /usr/local/cuda/bin/nvcc \
            --cuda-arch "${{ inputs.cuda_arch }}" \
            --label-prefix "$LABEL" \
            --output-root "$OUTPUT_ROOT" \
            --artifact-dir "$OUTPUT_ROOT/ci_artifacts/$LABEL"

      - name: Upload CUDA compile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elegant-cuda-ci-${{ env.LABEL }}
          path: elegant/test/gpu_cuda/output/ci_artifacts/${{ env.LABEL }}/
          if-no-files-found: warn

  gpu-runtime:
    name: GPU Runtime Correctness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gpu_runtime }}
    runs-on: [self-hosted, linux, x64, cuda]
    env:
      LABEL: gpu-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_ROOT: ${{ github.workspace }}/elegant/test/gpu_cuda/output
    steps:
      - name: Checkout elegant
        uses: actions/checkout@v4
        with:
          path: elegant

      - name: Checkout SDDS
        uses: actions/checkout@v4
        with:
          repository: rtsoliday/SDDS
          path: SDDS

      - name: Select CUDA compiler
        run: |
          NVCC_PATH="${NVCC:-}"
          if [ -z "$NVCC_PATH" ]; then
            if command -v nvcc >/dev/null 2>&1; then
              NVCC_PATH=$(command -v nvcc)
            else
              NVCC_PATH=/usr/local/cuda-12.4/bin/nvcc
            fi
          fi
          if [ ! -x "$NVCC_PATH" ]; then
            echo "nvcc not found or not executable: $NVCC_PATH" >&2
            exit 1
          fi
          echo "NVCC_PATH=$NVCC_PATH" >> "$GITHUB_ENV"

      - name: Show CUDA and MPI tools
        run: |
          nvidia-smi
          "$NVCC_PATH" --version
          if command -v mpirun >/dev/null 2>&1; then
            mpirun --version | head -n 1
          fi

      - name: Build all available variants
        working-directory: elegant
        run: |
          make NVCC="$NVCC_PATH" CUDA_ARCH="${{ inputs.cuda_arch }}" -j "$JOBS"

      - name: Run GPU runtime CI stage
        working-directory: elegant
        env:
          CASE_NAME: ${{ inputs.case }}
          TARGET_SECONDS: ${{ inputs.target_seconds }}
          RUN_PELEGANT: ${{ inputs.run_pelegant }}
          RUN_TIMING: ${{ inputs.run_timing }}
        run: |
          args=(
            --gpu-smoke
            --fallback-report
            --case "$CASE_NAME"
            --label-prefix "$LABEL"
            --output-root "$OUTPUT_ROOT"
            --artifact-dir "$OUTPUT_ROOT/ci_artifacts/$LABEL"
          )
          if [ "$RUN_PELEGANT" = "true" ]; then
            args+=(--pelegant-smoke)
          fi
          if [ "$RUN_TIMING" = "true" ]; then
            args+=(--timing --target-seconds "$TARGET_SECONDS")
          fi
          ./test/gpu_cuda/ci_release.sh "${args[@]}"

      - name: Upload GPU runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elegant-cuda-ci-${{ env.LABEL }}
          path: elegant/test/gpu_cuda/output/ci_artifacts/${{ env.LABEL }}/
          if-no-files-found: warn
